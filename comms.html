<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Broadcast Intercom</title>
    <script src="./thirdparty/jquery/jquery-3.6.0.js"></script>
    <script src="./thirdparty/jquery/jquery-ui.js"></script>
    <link rel="stylesheet" href="./thirdparty/jquery/jquery-ui.css">
    <style>
        body {
            background: #222;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #intercom-container {
            width: 420px;
            margin: auto;
            padding: 20px;
            background: #333;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(255, 255, 255, 0.1);
        }

        #channels {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .channel {
            width: 120px;
            height: 50px;
            background: red;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            transition: background 0.3s;
            cursor: pointer;
        }

        .channel.active {
            background: green;
        }

        #mute {
            width: 120px;
            height: 50px;
            margin-top: 20px;
            background: gray;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            transition: background 0.3s;
            cursor: pointer;
        }

        #mute.active {
            background: darkred;
        }
    </style>
</head>
<body>
    <div id="intercom-container">
        <h1>Intercom Panel</h1>
        <div id="channels">
            <button class="channel" id="ch1">Talk 1</button>
            <button class="channel" id="ch2">Talk 2</button>
            <button class="channel" id="ch3">Talk 3</button>
            <button class="channel" id="ch4">Talk 4</button>
            <button class="channel" id="ch5">Talk 5</button>
            <button class="channel" id="ch6">Talk 6</button>
            <button class="channel" id="ch7">Talk 7</button>
            <button class="channel" id="ch8">Talk 8</button>
            <button class="channel" id="ch9">Talk 9</button>
            <button class="channel" id="ch10">Talk 10</button>
            <button class="channel" id="ch11">Talk 11</button>
            <button class="channel" id="ch12">Talk 12</button>
        </div>
        <div id="controls">
            <button id="mute">Mute</button>
        </div>
    </div>

    <script>
        let muteState = false;
        let currentTalkChannel = null;
        let stream = null;

        async function setupAudio() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                console.log("Audio setup complete.");
            } catch (error) {
                console.error("Error accessing microphone:", error);
                alert("Please allow microphone access.");
            }
        }

        document.querySelectorAll('.channel').forEach(button => {
            button.addEventListener("mousedown", () => {
                startTalking(button.id);
            });

            button.addEventListener("mouseup", () => {
                stopTalking(button.id);
            });

            button.addEventListener("mouseleave", () => {
                stopTalking(button.id);
            });
        });

        function startTalking(channelId) {
            if (!stream) return alert("Microphone not available.");
            if (muteState) return;
            
            currentTalkChannel = channelId;
            document.getElementById(channelId).classList.add("active");

            // Simulate VDO.Ninja command to enable mic
            console.log("Talking on", channelId);
        }

        function stopTalking(channelId) {
            if (currentTalkChannel === channelId) {
                document.getElementById(channelId).classList.remove("active");
                currentTalkChannel = null;

                // Simulate VDO.Ninja command to disable mic
                console.log("Stopped talking on", channelId);
            }
        }

        document.getElementById("mute").addEventListener("click", () => {
            muteState = !muteState;
            document.getElementById("mute").classList.toggle("active");

            // Simulate VDO.Ninja mute toggle
            console.log("Mute State:", muteState);
        });

        setupAudio();
    </script>
</body>
</html>
