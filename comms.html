<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Broadcast Intercom</title>
    <script src="./thirdparty/jquery/jquery-3.6.0.js"></script>
    <script src="./thirdparty/jquery/jquery-ui.js"></script>
    <link rel="stylesheet" href="./thirdparty/jquery/jquery-ui.css">
    <style>
        body {
            background: #222;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #intercom-container {
            width: 90%;
            margin: auto;
            padding: 20px;
            background: #333;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }

        #groups {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .group {
            width: 150px;
            height: 50px;
            background: red;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            transition: background 0.3s;
            cursor: pointer;
        }

        .group.active {
            background: green;
        }

        .volume-control {
            width: 100px;
        }

        #user-list {
            width: 200px;
            background: #444;
            border-radius: 5px;
            padding: 10px;
            text-align: left;
        }

        #mute-mic {
            background: gray;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            transition: background 0.3s;
            cursor: pointer;
            padding: 10px;
        }

        #mute-mic.active {
            background: darkred;
        }
    </style>
</head>
<body>
    <div id="intercom-container">
        <div>
            <h2>Productions</h2>
            <div id="groups">
                <button class="group" id="grp1">Production 1</button>
                <button class="group" id="grp2">Production 2</button>
                <button class="group" id="grp3">Production 3</button>
            </div>
        </div>

        <div>
            <h2>Connected Users</h2>
            <div id="user-list">
                <p>User 1</p>
                <p>User 2</p>
                <p>User 3</p>
            </div>
        </div>

        <div>
            <h2>Controls</h2>
            <button id="mute-mic">Mute Mic</button>
            <h3>Volume</h3>
            <input type="range" class="volume-control" min="0" max="100">
        </div>
    </div>

    <script>
        let muteState = false;
        let activeGroup = null;
        let stream = null;

        async function setupAudio() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                console.log("Audio setup complete.");
            } catch (error) {
                console.error("Error accessing microphone:", error);
                alert("Please allow microphone access.");
            }
        }

        document.querySelectorAll('.group').forEach(button => {
            button.addEventListener("click", () => {
                if (activeGroup) {
                    document.getElementById(activeGroup).classList.remove("active");
                }
                activeGroup = button.id;
                button.classList.add("active");
                console.log("Latched to", button.id);
            });
        });

        document.getElementById("mute-mic").addEventListener("click", () => {
            muteState = !muteState;
            document.getElementById("mute-mic").classList.toggle("active");
            console.log("Mute State:", muteState);
        });

        setupAudio();
    </script>
</body>
</html>
